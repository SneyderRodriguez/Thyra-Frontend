<section id="login" class="auth-section">
    <div>
        <div>
            <div>
                <img src="assets/img/img_signin.jpg" alt="Ilustración de inicio de sesión">
            </div>
            <div>
                <a class="auth-switch" href="#registro" data-auth-view="register">
                    Registrarse
                </a>
                <form>
                    <div>
                        <input type="email" id="loginEmail" placeholder="Correo" name="email"
                            autocomplete="email" required>
                    </div>
                    <div>
                        <input type="password" id="loginPassword" placeholder="Contraseña"
                            name="password" autocomplete="current-password" required>
                    </div>
                    <div>
                        <input type="checkbox" id="rememberCredentials" name="remember">
                        <label for="rememberCredentials">
                            Recordar credenciales
                        </label>
                    </div>
                    <a href="">¿Olvidaste la contraseña?</a>
                    <button type="submit">
                        Iniciar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>

<section id="registro" class="auth-section">
    <div>
        <div>
            <div>
                <a class="auth-switch" href="#login" data-auth-view="login">
                    Iniciar sesión
                </a>
                <form>
                    <div>
                        <label>
                            Nombre
                        </label>
                        <input type="text" name="name" autocomplete="name"
                            required>
                    </div>
                    <div>
                        <label>
                            Correo
                        </label>
                        <input type="email" name="email" autocomplete="email"
                            required>
                    </div>
                    <div>
                        <label>
                            Contraseña
                        </label>
                        <input type="password" name="password"
                            autocomplete="new-password" required>
                    </div>
                    <div>
                        <label>
                            Confirmar contraseña
                        </label>
                        <input type="password" name="confirmPassword"
                            autocomplete="new-password" required>
                    </div>
                    <div>
                        <div>
                            <input type="checkbox" name="terms" required>
                            <label>
                                Acepto los términos de servicio y las políticas de privacidad
                            </label>
                        </div>
                    </div>
                    <div>
                        <button type="submit">
                            Registrarse
                        </button>
                    </div>
                </form>
            </div>
            <div>
                <img src="assets/img/img_signin.jpg" alt="Ilustración de registro">
            </div>
        </div>
    </div>
</section>
